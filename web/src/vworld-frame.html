<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#112b3c;color:white}</style><script src="__SDK_URL__"></script></head><body><div id="map"></div><script>
'use strict';
const appOrigin=__APP_ORIGIN__;const session='__SESSION__';let viewer,latest,owned=[];
function report(type,message){parent.postMessage({scope:'vworld-prototype',session,type,message},appOrigin);}
function draw(data){
 if(!viewer){latest=data;return;}owned.forEach(e=>viewer.entities.remove(e));owned=[];
 data.positions.forEach(p=>{
 let position=Cesium.Cartesian3.fromDegrees(p.lon,p.lat),heightReference=Cesium.HeightReference.CLAMP_TO_GROUND;
 try{const ground=viewer.scene.clampToHeight(Cesium.Cartesian3.fromDegrees(p.lon,p.lat,9000));if(ground){const c=Cesium.Cartographic.fromCartesian(ground);position=Cesium.Cartesian3.fromRadians(c.longitude,c.latitude,c.height+2);heightReference=Cesium.HeightReference.NONE;}}catch(_){/* Tiles may be unavailable; fallback height is approximate. */}
 owned.push(viewer.entities.add({position,point:{pixelSize:p.id===data.selected?16:10,color:Cesium.Color.CYAN,outlineColor:Cesium.Color.WHITE,outlineWidth:2,heightReference,disableDepthTestDistance:Infinity},label:{text:p.name+(p.positionSource==='synthetic'?' [시험]':''),font:'14px sans-serif',pixelOffset:new Cesium.Cartesian2(0,-25),heightReference,disableDepthTestDistance:Infinity,showBackground:true}}));
 });
 if(data.sector)owned.push(viewer.entities.add({polygon:{hierarchy:Cesium.Cartesian3.fromDegreesArray(data.sector.flat()),material:Cesium.Color.ORANGE.withAlpha(.3)}}));
 if(data.flyTo){const p=data.positions.find(p=>p.id===data.selected);if(p)viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,4500),orientation:{heading:0,pitch:Cesium.Math.toRadians(-75),roll:0}});}
}
addEventListener('message',e=>{if(e.source!==parent||e.origin!==appOrigin||e.data?.session!==session||e.data?.scope!=='vworld-prototype')return;if(e.data.type==='draw')draw(e.data);});
try{
 if(typeof vw==='undefined')throw new Error('VWorld SDK를 불러오지 못했습니다. 키의 등록 주소와 네트워크를 확인하세요.');
 // v3 API matches the user's bukhansan-weather site. Register callback before start.
 vw.ws3dInitCallBack=function(){try{viewer=ws3d.viewer;draw(latest||{positions:[]});report('ready','VWorld 3D 뷰어 초기화 완료');}catch(_){report('error','VWorld 뷰어 초기화에 실패했습니다.');}};
 const map=new vw.Map();map.setOption({mapId:'map',initPosition:new vw.CameraPosition(new vw.CoordZ(126.977,37.6585,10000),new vw.Direction(0,-75,0)),logo:true,navigation:true});map.start();
}catch(e){report('error',e.message);}
</script></body></html>
