<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>html,body,#map{margin:0;width:100%;height:100%;overflow:hidden;background:#112b3c;color:white}</style><script>window.vworldSdkTransport={loaded:false,failed:false};</script><script src="__SDK_URL__" onload="window.vworldSdkTransport.loaded=true" onerror="window.vworldSdkTransport.failed=true"></script></head><body><div id="map"></div><script>
'use strict';
const appOrigin=__APP_ORIGIN__;const session='__SESSION__';let viewer,latest,owned=[],originalFrustum=null;const cameras=new Map();
let coverageOwned=[];const coverageCameras=new Map();
function excludedOverlays(){return [...owned,...coverageOwned,...Array.from(layerSources.values()).flatMap(s=>s.entities.values)];}
function drawCoverage(data){
 if(!viewer)return;
 coverageOwned.forEach(e=>viewer.entities.remove(e));coverageOwned=[];coverageCameras.clear();
 try{
  for(const shape of data.shapes){
   const color=Cesium.Color.fromCssColorString(shape.color),selected=shape.cameraId===data.selected;
   const add=definition=>{const e=viewer.entities.add(definition);coverageOwned.push(e);coverageCameras.set(e,shape.cameraId);};
   const classification=Cesium.ClassificationType?{classificationType:Cesium.ClassificationType.BOTH}:{};
   add({name:shape.name+' · 범위 시안',polygon:{hierarchy:Cesium.Cartesian3.fromDegreesArray(shape.coordinates.flat()),material:color.withAlpha(selected?.28:.16),...classification}});
   for(const line of [shape.coordinates,shape.centerline])add({polyline:{positions:Cesium.Cartesian3.fromDegreesArray(line.flat()),width:selected?3:2,material:color.withAlpha(.9),clampToGround:true,...classification}});
  }
  parent.postMessage({scope:'vworld-prototype',session,type:'coverage-status',requestId:data.requestId,ok:true},appOrigin);
 }catch(_){coverageOwned.forEach(e=>viewer.entities.remove(e));coverageOwned=[];coverageCameras.clear();parent.postMessage({scope:'vworld-prototype',session,type:'coverage-status',requestId:data.requestId,ok:false},appOrigin);}
}
let layerRevision=null,layerGeneration=0,latestLayers=null,layerVisibility=new Set();const layerSources=new Map();
function drawLayers(data){
 if(!viewer){latestLayers=data;return;}
 layerVisibility=new Set(data.visibleIds);
 if(data.revision===layerRevision){layerSources.forEach((source,id)=>{source.show=layerVisibility.has(id);});return;}
 layerRevision=data.revision;const generation=++layerGeneration;
 layerSources.forEach(source=>viewer.dataSources.remove(source,true));layerSources.clear();
 data.layers.forEach(layer=>{
  const answer=ok=>{if(generation===layerGeneration)parent.postMessage({scope:'vworld-prototype',session,type:'layer-status',revision:data.revision,id:layer.id,ok},appOrigin);};
  try{
   if(typeof Cesium.GeoJsonDataSource?.load!=='function'||!viewer.dataSources)throw new Error('GeoJSON viewer unavailable');
   // Draw every park boundary ring independently, including polygon holes.
   // Keep original polygons in the parent configuration for export.
   const geojson=layer.kind==='boundary'?{type:'FeatureCollection',features:layer.geojson.features.map(f=>({type:'Feature',properties:{name:f.properties.name},geometry:{type:'MultiLineString',coordinates:f.geometry.type==='Polygon'?f.geometry.coordinates:f.geometry.coordinates.flat()}}))}:layer.geojson;
   const color=Cesium.Color.fromCssColorString(layer.kind==='boundary'?'#71f2cf':'#ffca68');
   Promise.resolve(Cesium.GeoJsonDataSource.load(geojson,{clampToGround:true,stroke:color,strokeWidth:layer.kind==='boundary'?3:2})).then(async source=>{
    if(generation!==layerGeneration){source.destroy?.();return;}
    source.name=layer.name;source.show=layerVisibility.has(layer.id);
    // Ground polylines can drape on both terrain and VWorld's 3D tiles.
    for(const entity of source.entities.values){if(entity.polyline&&Cesium.ClassificationType)entity.polyline.classificationType=Cesium.ClassificationType.BOTH;}
    await viewer.dataSources.add(source);
    if(generation!==layerGeneration){viewer.dataSources.remove(source,true);return;}
    source.show=layerVisibility.has(layer.id);layerSources.set(layer.id,source);answer(true);
   }).catch(()=>answer(false));
  }catch(_){answer(false);}
 });
}
function report(type,message){parent.postMessage({scope:'vworld-prototype',session,type,message},appOrigin);}
function endCalibration(){
 if(!viewer)return;
 if(viewer.scene.screenSpaceCameraController)viewer.scene.screenSpaceCameraController.enableInputs=true;
 if(originalFrustum){viewer.camera.frustum.fov=originalFrustum.fov;viewer.camera.frustum.aspectRatio=originalFrustum.aspectRatio;originalFrustum=null;}
}
function calibrate(data){
 const answer=(type,values)=>parent.postMessage({scope:'vworld-prototype',session,type,requestId:data.requestId,...values},appOrigin);
 try{
  const p=data.position,pose=data.pose,aspect=data.aspectRatio??(viewer?.scene?.canvas?.clientWidth/viewer?.scene?.canvas?.clientHeight);
  const within=(n,low,high)=>Number.isFinite(n)&&n>=low&&n<=high;
  if(!viewer||typeof viewer.camera.setView!=='function'||!('fov' in viewer.camera.frustum))throw new Error('현재 지도 SDK의 가상 시점 보정 기능을 확인할 수 없습니다.');
  if(!p||!within(p.lat,-90,90)||!within(p.lon,-180,180)||!pose||!within(pose.headingDeg,0,359.999999)||!within(pose.pitchDeg,-80,80)||!within(pose.horizontalFovDeg,5,120)||!within(pose.cameraHeightM,.5,100)||!within(aspect,.1,10))throw new Error('가상 시점의 좌표·각도·높이·영상 비율을 확인하세요.');
  let ground=data.groundElevationM,source='operator';
  if(ground===null){
   source='map-terrain';ground=undefined;
   if(typeof viewer.scene.clampToHeight==='function'&&typeof Cesium.Cartographic.fromCartesian==='function'){
    try{const surface=viewer.scene.clampToHeight(Cesium.Cartesian3.fromDegrees(p.lon,p.lat,9000),excludedOverlays());if(surface)ground=Cesium.Cartographic.fromCartesian(surface).height;}catch(_){/* Missing rendered terrain remains unknown. */}
   }
   if(!Number.isFinite(ground)&&typeof viewer.scene.globe?.getHeight==='function'){
    const flat=typeof Cesium.EllipsoidTerrainProvider==='function'&&viewer.terrainProvider instanceof Cesium.EllipsoidTerrainProvider;
    if(!flat)ground=viewer.scene.globe.getHeight(Cesium.Cartographic.fromDegrees(p.lon,p.lat));
   }
   if(!Number.isFinite(ground))throw new Error('해당 위치의 지도 지형 높이를 아직 읽지 못했습니다. 지형 로딩 후 다시 적용하거나 지도 기준 지면 높이를 입력하세요.');
  }
  if(!within(ground,-500,9000))throw new Error('지도 지면 높이는 -500~9000m 범위여야 합니다.');
  if(!originalFrustum)originalFrustum={fov:viewer.camera.frustum.fov,aspectRatio:viewer.camera.frustum.aspectRatio};
  // Cesium PerspectiveFrustum.fov is horizontal for a landscape viewport,
  // vertical for a portrait viewport. Keep the reference image's aspect ratio.
  const horizontal=Cesium.Math.toRadians(pose.horizontalFovDeg);
  viewer.camera.frustum.aspectRatio=aspect;
  viewer.camera.frustum.fov=aspect>=1?horizontal:2*Math.atan(Math.tan(horizontal/2)/aspect);
  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,ground+pose.cameraHeightM),orientation:{heading:Cesium.Math.toRadians(pose.headingDeg),pitch:Cesium.Math.toRadians(pose.pitchDeg),roll:0}});
  if(viewer.scene.screenSpaceCameraController)viewer.scene.screenSpaceCameraController.enableInputs=false;
  answer('calibration-ready',{groundElevationM:ground,groundElevationSource:source});
 }catch(e){endCalibration();answer('calibration-error',{message:e.message});}
}
function draw(data){
 if(!viewer){latest=data;return;}owned.forEach(e=>viewer.entities.remove(e));owned=[];cameras.clear();
 data.positions.forEach(p=>{
 let position=Cesium.Cartesian3.fromDegrees(p.lon,p.lat),heightReference=Cesium.HeightReference.CLAMP_TO_GROUND;
 try{const ground=viewer.scene.clampToHeight(Cesium.Cartesian3.fromDegrees(p.lon,p.lat,9000),excludedOverlays());if(ground){const c=Cesium.Cartographic.fromCartesian(ground);position=Cesium.Cartesian3.fromRadians(c.longitude,c.latitude,c.height+2);heightReference=Cesium.HeightReference.NONE;}}catch(_){/* Tiles may be unavailable; fallback height is approximate. */}
 const entity=viewer.entities.add({position,point:{pixelSize:p.id===data.selected?16:10,color:Cesium.Color.CYAN,outlineColor:Cesium.Color.WHITE,outlineWidth:2,heightReference,disableDepthTestDistance:Infinity},label:{text:p.name+(p.positionSource==='synthetic'?' [시험]':''),font:'14px sans-serif',pixelOffset:new Cesium.Cartesian2(0,-25),heightReference,disableDepthTestDistance:Infinity,showBackground:true}});owned.push(entity);cameras.set(entity,p.id);
 });
 if(data.sector)owned.push(viewer.entities.add({polygon:{hierarchy:Cesium.Cartesian3.fromDegreesArray(data.sector.flat()),material:Cesium.Color.ORANGE.withAlpha(.3)}}));
 if(data.flyTo){endCalibration();const p=data.positions.find(p=>p.id===data.selected);if(p)viewer.camera.flyTo({destination:Cesium.Cartesian3.fromDegrees(p.lon,p.lat,4500),orientation:{heading:0,pitch:Cesium.Math.toRadians(-75),roll:0}});}
}
addEventListener('message',e=>{if(e.source!==parent||e.origin!==appOrigin||e.data?.session!==session||e.data?.scope!=='vworld-prototype')return;if(e.data.type==='draw')draw(e.data);if(e.data.type==='layers')drawLayers(e.data);if(e.data.type==='coverage')drawCoverage(e.data);if(e.data.type==='fit-layers'&&viewer&&Cesium.Rectangle){endCalibration();viewer.camera.flyTo({destination:Cesium.Rectangle.fromDegrees(...e.data.bounds)});}if(e.data.type==='calibrate')calibrate(e.data);if(e.data.type==='end-calibration')endCalibration();});
try{
 if(typeof vw==='undefined')throw new Error(window.vworldSdkTransport.failed
  ? 'VWorld SDK를 불러오지 못했습니다. 적용된 키로 SDK 파일을 요청했지만 내려받기에 실패했습니다. 네트워크 연결과 브라우저의 요청 오류를 확인하세요.'
  : 'VWorld SDK를 불러오지 못했습니다. 응답에 지도 모듈이 없습니다. 키의 등록 주소·사용 API와 하위 스크립트 로딩을 확인하세요.');
 // v3 API matches the user's bukhansan-weather site. Register callback before start.
 vw.ws3dInitCallBack=function(){try{viewer=ws3d.viewer;draw(latest||{positions:[]});if(latestLayers)drawLayers(latestLayers);
 if(Cesium.ScreenSpaceEventHandler&&Cesium.ScreenSpaceEventType&&viewer.scene.canvas){const clicks=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);clicks.setInputAction(event=>{const picked=viewer.scene.pick(event.position)?.id,id=cameras.get(picked)??coverageCameras.get(picked);if(id)parent.postMessage({scope:'vworld-prototype',session,type:'select-camera',id},appOrigin);},Cesium.ScreenSpaceEventType.LEFT_CLICK);}
 report('ready','VWorld 3D 뷰어 초기화 완료');}catch(_){report('error','VWorld 뷰어 초기화에 실패했습니다.');}};
 const map=new vw.Map();map.setOption({mapId:'map',initPosition:new vw.CameraPosition(new vw.CoordZ(126.977,37.6585,10000),new vw.Direction(0,-75,0)),logo:true,navigation:true});map.start();
}catch(e){report('error',e.message);}
</script></body></html>
