name: SSM connection test

on:
  workflow_dispatch:
  push:
    branches: [feat/vworld-monitoring-prototype]
    paths:
      - '.github/workflows/ssm-connection-test.yml'
      - 'bridge/SsmConnectionTest/**'
      - 'tests/test_ssm_connection.py'
      - 'tests/SsmCertificateChecks/**'
      - 'scripts/build-ssm-diagnostic.py'
      - 'docs/ssm-connection-test.md'
      - 'global.json'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'
      - name: Build diagnostic and test against synthetic HTTPS SSM
        run: |
          dotnet build bridge/SsmConnectionTest -c Release --nologo
          dotnet run --project tests/SsmCertificateChecks -c Release
          python3 tests/test_ssm_connection.py
      - name: Build Windows x64 package
        run: python3 scripts/build-ssm-diagnostic.py
      - name: Register downloadable diagnostic
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: SSM-Connection-Test-Windows
          path: |
            artifacts/SSM-Connection-Test-win-x64.zip
            artifacts/SSM-Connection-Test-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          echo "## SSM connection test for Windows x64" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Extract both ZIPs, then run SsmConnectionTest.exe. Enter your HTTPS origin and SHA-256 pin locally." >> "$GITHUB_STEP_SUMMARY"
          echo "No PTZ commands. Keep camera-preview.private.json local; share connection-report.json only." >> "$GITHUB_STEP_SUMMARY"
          echo "Version 5: select one camera, then choose Y for local Domain. Adds one signed GET /V1/Domain?type=local to compare configured domains; no CONTROL or PTZ requests. Keep camera-control-routing.private.json private." >> "$GITHUB_STEP_SUMMARY"
